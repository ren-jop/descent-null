[package]
name = "descent_null"
version = "0.2.0"
edition = "2021"
default-run = "descent_null"

[lib]
name = "descent_null"
path = "src/lib.rs"

[[bin]]
name = "descent_null"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.17", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_mesh",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "wav",
] }
avian2d = "0.4"
rand = "0.8"
